<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simpel Booking</title>
  <style>
    :root {
      --bg-color: #fff;
      --text-color: #000;
      --accent: #a671d3;
    }

    body.dark-mode {
      --bg-color: #1e1e1e;
      --text-color: #f0f0f0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      position: relative;
      margin-bottom: 2rem;
    }

    .back-link {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      padding: 1rem 1.25rem;
    }

    .back-link a {
      color: var(--accent);
      font-weight: bold;
      text-decoration: none;
    }

    h1 {
      color: var(--accent);
      text-align: center;
      margin: 0 auto;
    }

    .dark-mode-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    select, button {
      padding: 0.5rem;
      margin-top: 1rem;
      font-size: 1rem;
    }

    .card {
      background: rgba(166, 113, 211, 0.1);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 2rem;
      max-width: 400px;
    }

    .main-button {
      background: var(--accent);
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }

    .booking-wrapper {
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
      align-items: center;
    }

    .toggle-switch {
    position: relative;
    display: inline-block;
    width: 80px;
    height: 40px;
}

.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ddd;
    border-radius: 40px;
    transition: 0.4s;
}

.slider:before {
    position: absolute;
    content: "";
    height: 34px;
    width: 34px;
    left: 3px;
    bottom: 3px;
    background: url('sunIcon.png') center/cover no-repeat;
    background-color: white;
    border-radius: 50%;
    transition: 0.4s;
}

input:checked + .slider {
    background-color: #4B0082;
}

input:checked + .slider:before {
    transform: translateX(38px); /* Justert for ny bredde */
    background: url('sunPurple.png') center/cover no-repeat;
    background-color: #4B0082;
    border-radius: 50%;
}

  </style>
</head>
<body>
  <header>
    <div class="back-link">
      <a href="../hjem/hjem.html">← Tilbake til Hjem</a>
    </div>
      
    <h1>Book en time</h1>
    
    <div class="dark-mode-toggle">
      <label class="toggle-switch" aria-label="Bytt til mørk modus">
        <input type="checkbox" id="mode-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <div class="booking-wrapper">
    <div class="card">
      <label for="fag">Velg fag:</label><br>
      <select id="fag">
        <option>Programmering</option>
        <option>Mekanikk</option>
        <option>Organisk kjemi</option>
        <option>Mikrobiologi</option>
        <option>Statistikk</option>
        <option>Økonomisk analyse</option>
      </select>
    </div>

    <div class="card">
      <label for="tid">Velg tidspunkt:</label><br>
      <select id="tid">
        <option>09:00</option>
        <option>11:00</option>
        <option>13:00</option>
        <option>15:00</option>
      </select>
    </div>

    <button class="main-button" id="bookBtn">Book Time</button>
  </div>

  <!-- 🧠 Script plassert etter alt innhold -->
  <script>
    // Dark mode
    const toggleSwitch = document.getElementById("mode-toggle");
    const body = document.body;

    if (localStorage.getItem("darkMode") === "enabled") {
      body.classList.add("dark-mode");
      toggleSwitch.checked = true;
    }

    toggleSwitch.addEventListener("change", function () {
      if (this.checked) {
        body.classList.add("dark-mode");
        localStorage.setItem("darkMode", "enabled");
      } else {
        body.classList.remove("dark-mode");
        localStorage.setItem("darkMode", "disabled");
      }
    });

    // Bekreftelses-popup
    document.getElementById("bookBtn").addEventListener("click", function () {
      const subject = document.getElementById("fag").value;
      const time = document.getElementById("tid").value;
      alert(`✅ Din time i ${subject} kl. ${time} er bekreftet!`);
    });
  </script>
</body>
</html>
