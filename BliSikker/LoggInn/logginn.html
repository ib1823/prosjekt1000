<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logg Inn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9; /* Lys grønn bakgrunn for å matche en grønn logo */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff; /* Hvit bakgrunn for innloggingsvinduet */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
            color: #388e3c; /* Mørkere grønn farge for overskriften */
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50; /* Grønn farge for logg inn-knappen */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .login-container button:hover {
            background-color: #45a049; /* Mørkere grønn når knappen er hoveret */
        }
        .login-container .forgot-password {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            color: #388e3c; /* Mørkere grønn farge for glemt passord-lenken */
            text-decoration: none;
        }
        .login-container .forgot-password:hover {
            text-decoration: underline;
        }
        .login-container .register-link {
            display: block;
            margin-top: 20px;
            font-size: 14px;
            color: #4CAF50; /* Grønn farge for registrer deg-lenken */
            text-decoration: none;
        }
        .login-container .register-link:hover {
            text-decoration: underline;
        }
        .logo {
            width: 150px; /* Juster størrelsen på logoen etter behov */
            margin-bottom: 20px; /* Avstand mellom logoen og innloggingsskjemaet */
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo lagt til her -->
        <img src="BliSikkerLogo (2).png" alt="Bli Sikker Logo" class="logo">
        
        <h2>Logg Inn</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Brukernavn" required>
            <input type="password" name="password" placeholder="Passord" required>
            <button type="submit">Logg Inn</button>
        </form>
        <a href="#" class="forgot-password">Glemt passord?</a>
        <!-- Oppdatert lenke til registreringssiden -->
        <a href="../Registrering/registrering.html" class="register-link">Registrer deg</a>
    </div>

</body>
</html>
